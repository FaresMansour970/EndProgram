<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقرير نهاية الدورة التدريبية | Tech Box</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f40;--gold:#c9a227;--gray:#8e8f94;--bg:#f3f4f7;--card:#fff;--text:#1b2233;--line:#d9dce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--text:#e8ebf3;--line:#2c3856;--navy:#e8c35a}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--text:#e8ebf3;--line:#2c3856;--navy:#e8c35a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.6}
header{background:#0b1f40;color:#fff;padding:16px;border-bottom:4px solid var(--gold);text-align:center}
.logo{font-size:30px;font-weight:700}.logo b{color:var(--gold)}.logo img{height:110px;background:#fff;border-radius:12px;padding:6px}
header p{margin:2px 0 0;color:#c7cbd6}
main{max-width:900px;margin:20px auto;padding:0 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px;color:var(--navy);border-inline-start:4px solid var(--gold);padding-inline-start:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--text)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#0b1f40;color:#fff}
button.gold{background:var(--gold);color:#0b1f40}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
#msg{color:var(--gold);font-weight:700;min-height:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.row .n{flex:2;min-width:150px}.row .a{flex:0 0 100px}.row .r{flex:1;min-width:130px}.row button{padding:6px 12px}
.saved{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.saved:last-child{border:0}.saved span{flex:1}.saved button{padding:5px 10px;font-size:13px}
small.h{color:var(--gray)}
#pd{display:none;font-family:'Tajawal',Tahoma,Arial,sans-serif;color:#1b2233;font-size:11pt;line-height:1.6;padding-bottom:14mm}
#pd .lh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #c9a227;padding-bottom:8px;margin-bottom:10px}
#pd .lg{font-size:28pt;font-weight:700;color:#0b1f40;line-height:1.1}#pd .lg b{color:#c9a227}#pd .lg img{height:90px}#pd .lg small{display:block;font-size:9pt;color:#8e8f94;font-weight:400}
#pd .tt{text-align:left;direction:ltr}#pd .tt h1{margin:0;font-size:16pt;color:#0b1f40}#pd .tt div{font-size:9.5pt;color:#555}
#pd h3{background:#0b1f40;color:#fff;padding:3px 10px;font-size:11pt;margin:12px 0 6px;border-inline-start:5px solid #c9a227;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pd table{width:100%;border-collapse:collapse}#pd tr{break-inside:avoid}
#pd th,#pd td{border:1px solid #b9bdc7;padding:3px 8px;text-align:right;font-size:10pt}
#pd th{background:#eef0f5;color:#0b1f40;width:16%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pd .stats{display:flex;gap:8px;margin-bottom:8px}#pd .st{flex:1;border:1px solid #b9bdc7;text-align:center;padding:4px;font-size:9.5pt}#pd .st b{display:block;font-size:15pt;color:#0b1f40}
#pd .tx{border:1px solid #b9bdc7;padding:5px 10px;min-height:30px;white-space:pre-wrap;break-inside:avoid}
#pd .sg{display:flex;gap:10px;margin-top:16px;break-inside:avoid}#pd .sg div{flex:1;border:1px solid #b9bdc7;padding:6px;height:105px;text-align:center;font-size:10pt}
#pd .sg b{display:block;background:#eef0f5;color:#0b1f40;margin:-6px -6px 6px;padding:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pd .ft{position:fixed;bottom:0;left:0;right:0;border-top:1px solid #0b1f40;font-size:8.5pt;color:#555;display:flex;justify-content:space-between;padding-top:3px;background:#fff}
@media print{@page{size:A4;margin:12mm}:root{padding:0}html,body{background:#fff!important;color:#000}header,main{display:none!important}#pd{display:block}}
</style>
</head>
<body>
<header><div class="logo" id="hl"></div><p>نموذج تقرير نهاية الدورة / البرنامج التدريبي</p></header>
<main>
<div class="actions">
<button class="gold" onclick="save()">حفظ التقرير</button>
<button onclick="printReport()">طباعة / PDF</button>
<button onclick="copyText()">نسخ كنص</button>
<button class="ghost" onclick="clearForm()">تقرير جديد</button>
</div>
<div id="msg"></div>
<form id="f" onsubmit="return false">
<section><h2>بيانات الدورة والمدرب</h2><div class="grid">
<div><label>اسم المدرب</label><input name="trainer"></div>
<div><label>اسم الدورة / البرنامج</label><input name="course"></div>
<div><label>الفئة المستهدفة</label><input name="group"></div>
<div><label>نمط التدريب</label><select name="mode"><option>حضوري</option><option>عن بُعد</option><option>مدمج</option></select></div>
<div><label>القاعة / المنصة</label><input name="venue"></div>
<div><label>تاريخ بدء الدورة</label><input type="date" name="sdate"></div>
<div><label>تاريخ انتهاء الدورة</label><input type="date" name="edate"></div>
<div><label>عدد الجلسات / الأيام</label><input type="number" min="0" name="sessions"></div>
<div><label>إجمالي ساعات التدريب</label><input type="number" min="0" name="hours"></div>
</div></section>

<section><h2>المتدربون والحضور</h2><div class="grid">
<div><label>عدد المسجلين</label><input type="number" min="0" name="reg"></div>
<div><label>أتمّوا الدورة</label><input type="number" min="0" name="done"></div>
<div><label>المنسحبون / لم يكملوا</label><input type="number" min="0" name="drop"></div>
<div><label>متوسط نسبة الحضور %</label><input type="number" min="0" max="100" name="avgatt"></div>
<div class="full"><label>قائمة المتدربين ونتائجهم</label>
<div class="row"><input id="newName" class="n" placeholder="اكتب اسم المتدرب ثم Enter (أو عدة أسماء مفصولة بفاصلة)"><button type="button" onclick="addTr()">إضافة</button></div>
<div id="trList"></div>
<small class="h">عند إضافة متدربين تُحسب الأعداد والمتوسط تلقائياً، ويمكنك تعديلها يدوياً.</small></div>
</div></section>

<section><h2>المحتوى المنفَّذ</h2><div class="grid">
<div class="full"><label>أهداف الدورة</label><textarea name="objectives"></textarea></div>
<div class="full"><label>المحاور والموضوعات التي تم تقديمها</label><textarea name="topics"></textarea></div>
<div><label>نسبة إنجاز الخطة التدريبية %</label><input type="number" min="0" max="100" name="planpct"></div>
<div class="full"><label>الأساليب والأنشطة العملية المستخدمة</label><textarea name="methods"></textarea></div>
<div class="full"><label>المواد والأدوات التدريبية المستخدمة</label><textarea name="materials"></textarea></div>
</div></section>

<section><h2>التقييم والنتائج</h2><div class="grid">
<div><label>مدى تحقيق أهداف الدورة</label><select name="goals"><option>تحققت بالكامل</option><option>تحققت بدرجة كبيرة</option><option>تحققت جزئياً</option><option>لم تتحقق</option></select></div>
<div><label>مستوى تفاعل المتدربين</label><select name="engage"><option>ممتاز</option><option>جيد جداً</option><option>جيد</option><option>ضعيف</option></select></div>
<div><label>رضا المتدربين (من 5)</label><input type="number" min="0" max="5" step="0.1" name="sat"></div>
<div class="full"><label>أدوات التقييم المستخدمة (اختبارات، مشاريع، ملاحظة...)</label><textarea name="assess"></textarea></div>
<div class="full"><label>ملخص نتائج المتدربين</label><textarea name="results"></textarea></div>
</div></section>

<section><h2>التحليل والملاحظات</h2><div class="grid">
<div class="full"><label>نقاط القوة</label><textarea name="strengths"></textarea></div>
<div class="full"><label>التحديات والصعوبات</label><textarea name="issues"></textarea></div>
<div class="full"><label>الانحرافات عن الخطة وأسبابها</label><textarea name="deviations"></textarea></div>
<div class="full"><label>ملاحظات المتدربين / تغذية راجعة</label><textarea name="feedback"></textarea></div>
</div></section>

<section><h2>التوصيات والمتابعة</h2><div class="grid">
<div class="full"><label>التوصيات لتطوير الدورة</label><textarea name="recs"></textarea></div>
<div class="full"><label>مقترحات المتابعة / دورات لاحقة</label><textarea name="future"></textarea></div>
<div class="full"><label>احتياجات من إدارة البرامج</label><textarea name="needs"></textarea></div>
<div><label>توقيع المدرب</label><input name="sign"></div>
</div></section>
</form>
<section><h2>التقارير المحفوظة (على هذا الجهاز)</h2><div id="list"></div></section>
</main>
<div id="pd"></div>

const v=tr.filter(x=>x.a!==''&&!isNaN(+x.a));
f.reg.value=tr.length;f.done.value=done;f.drop.value=tr.length-done;
if(v.length)f.avgatt.value=Math.round(v.reduce((s,x)=>s+ +x.a,0)/v.length)}
function addTr(){const inp=document.getElementById('newName');
inp.value.split(/[,،\n]/).map(s=>s.trim()).filter(Boolean).forEach(n=>tr.push({n,a:'',r:'جيد'}));inp.value='';renderTr(true);inp.focus()}
document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTr()}});
function copyText(){const d=data();let t='تقرير نهاية الدورة - Tech Box\n'+Object.keys(FL).map(k=>FL[k]+': '+(d[k]||'-')).join('\n');
if(tr.length)t+='\nالمتدربون:\n'+tr.map((x,i)=>(i+1)+'. '+x.n+' | حضور: '+(x.a||'-')+'% | '+x.r).join('\n');
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>msg('تم النسخ ✓')).catch(()=>msg('تعذر النسخ'))}
function fd(s){if(!s)return '—';try{return new Date(s+'T00:00:00').toLocaleDateString('ar',{year:'numeric',month:'long',day:'numeric'})}catch(e){return s}}
function setLogo(){const h=document.getElementById('hl');h.innerHTML='';
if(logo){const i=document.createElement('img');i.src=logo;i.alt='Tech Box';h.append(i)}else h.innerHTML='Tech <b>Box</b>'}
function printReport(){const d=data(),v=k=>esc(d[k]||'—');
const ref='TB-ECR-'+(d.edate||'').replace(/-/g,'')+'-'+esc((d.course||'').slice(0,12).replace(/\s+/g,'_'));
const r4=(a,x,b,y)=>'<tr><th>'+a+'</th><td>'+x+'</td><th>'+b+'</th><td>'+y+'</td></tr>';
const sec=(t,k)=>'<h3>'+t+'</h3><div class="tx">'+v(k)+'</div>';
const lg=logo?'<img src="'+esc(logo)+'" alt="">':'Tech <b>Box</b>';
let h='<div class="lh"><div class="lg">'+lg+'<small>إدارة البرامج والدورات التدريبية</small></div><div class="tt"><h1>End of Course Report</h1><div>تقرير نهاية الدورة التدريبية</div><div>Ref: '+ref+'</div></div></div>';
h+='<h3>بيانات الدورة</h3><table>'+r4('المدرب',v('trainer'),'الدورة / البرنامج',v('course'))+r4('الفئة المستهدفة',v('group'),'نمط التدريب',v('mode'))+r4('تاريخ البدء',esc(fd(d.sdate)),'تاريخ الانتهاء',esc(fd(d.edate)))+r4('عدد الجلسات',v('sessions'),'إجمالي الساعات',v('hours'))+r4('المكان / المنصة',v('venue'),'نسبة إنجاز الخطة',d.planpct?esc(d.planpct)+'%':'—')+'</table>';
h+='<h3>ملخص المتدربين والحضور</h3><div class="stats"><div class="st"><b>'+esc(d.reg||0)+'</b>المسجلون</div><div class="st"><b>'+esc(d.done||0)+'</b>أتمّوا الدورة</div><div class="st"><b>'+esc(d.drop||0)+'</b>المنسحبون</div><div class="st"><b>'+esc(d.avgatt||0)+'%</b>متوسط الحضور</div></div>';
if(tr.length){h+='<table><tr><th style="width:6%">#</th><th style="width:44%">اسم المتدرب</th><th style="width:20%">الحضور %</th><th style="width:30%">النتيجة</th></tr>'+tr.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.n)+'</td><td>'+esc(x.a||'—')+'</td><td>'+esc(x.r)+'</td></tr>').join('')+'</table>'}
h+=sec('أهداف الدورة','objectives')+sec('المحاور والموضوعات المنفَّذة','topics')+sec('الأساليب والأنشطة العملية','methods')+sec('المواد والأدوات التدريبية','materials');
h+='<h3>التقييم العام</h3><table>'+r4('تحقق الأهداف',v('goals'),'تفاعل المتدربين',v('engage'))+r4('رضا المتدربين',d.sat?esc(d.sat)+' / 5':'—','','')+'</table>';
h+=sec('أدوات التقييم المستخدمة','assess')+sec('ملخص نتائج المتدربين','results')+sec('نقاط القوة','strengths')+sec('التحديات والصعوبات','issues')+sec('الانحرافات عن الخطة وأسبابها','deviations')+sec('ملاحظات المتدربين','feedback')+sec('التوصيات لتطوير الدورة','recs')+sec('مقترحات المتابعة / دورات لاحقة','future')+sec('احتياجات من إدارة البرامج','needs');
h+='<div class="sg"><div><b>المدرب</b>'+v('trainer')+'<br><small>التوقيع: '+esc(d.sign||'')+'</small></div><div><b>منسق البرامج والدورات</b><small>الاسم / التوقيع / التاريخ</small></div><div><b>اعتماد الإدارة</b><small>الختم / التوقيع</small></div></div>';
h+='<div class="ft"><span>Tech Box — وثيقة رسمية داخلية</span><span>'+ref+'</span><span>طُبع بتاريخ '+new Date().toLocaleDateString('ar')+'</span></div>';
document.getElementById('pd').innerHTML=h;setTimeout(()=>window.print(),100)}
setLogo();renderTr(false);render();
</script>
</body>
</html>
